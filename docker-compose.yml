name: my_new_project_name
services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: grc_admin
      POSTGRES_PASSWORD: grc_secret_2026
      POSTGRES_DB: grc_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U grc_admin -d grc_platform" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Django REST Framework Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # On first run: use "sleep infinity" so you can exec in to init Django.
    # After Django is initialized, switch to the runserver command below.
    command: >
      sh -c "
        if [ -f manage.py ]; then
          echo '>>> manage.py found — running migrations + server...'
          python manage.py migrate --noinput &&
          python manage.py runserver 0.0.0.0:8000
        else
          echo '>>> No manage.py found — waiting for Django init...'
          echo '>>> Run: docker compose exec backend django-admin startproject core .'
          sleep infinity
        fi
      "
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Wazuh creds injected via environment variable — set WAZUH_API_PASSWORD in backend/.env
      WAZUH_API_HOST: "172.16.221.32"
      WAZUH_API_USER: "wazuh"
      WAZUH_API_PASSWORD: "wazuh"
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # React Frontend (Vite)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # ─────────────────────────────────────────────
  # Postgres MCP Server
  # ─────────────────────────────────────────────
  mcp-server:
    image: crystaldba/postgres-mcp:latest
    command: ["--transport=sse"]
    ports:
      - "8001:8000"
    environment:
      # Simple 'db' works here because they share the project network
      DATABASE_URI: postgresql://grc_admin:grc_secret_2026@db:5432/grc_platform
      ACCESS_MODE: unrestricted
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Redis (Celery Message Broker)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Celery Worker (Background Task Executor)
  # ─────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      WAZUH_API_HOST: "172.16.221.32"
      WAZUH_API_USER: "wazuh"
      WAZUH_API_PASSWORD: "wazuh"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Celery Beat (Periodic Task Scheduler)
  # ─────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
